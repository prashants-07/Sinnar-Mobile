spring:
  application:
    name: sinnar-mobile
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sinnar_mobile?serverTimezone=UTC}
    username: ${DB_USERNAME:sinnar_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_SECURE:true}
        same-site: ${SESSION_SAME_SITE:Lax}
app:
  cors-origins: ${CORS_ORIGINS:https://prashants-07.github.io}
  upload-dir: ${UPLOAD_DIR:./uploads}
  admin-username: ${ADMIN_USERNAME:}
  admin-password: ${ADMIN_PASSWORD:}
  admin-password-reset-id: ${ADMIN_PASSWORD_RESET_ID:}
  seed-demo: ${SEED_DEMO:false}
  public-site-url: ${PUBLIC_SITE_URL:https://prashants-07.github.io/Sinnar-Mobile/}
