services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: sinnar_mobile
      MYSQL_USER: sinnar_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent']
      interval: 10s
      timeout: 5s
      retries: 12
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/sinnar_mobile?serverTimezone=UTC
      DB_USERNAME: sinnar_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      SESSION_SECURE: ${SESSION_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://prashants-07.github.io}
      SEED_DEMO: ${SEED_DEMO:-false}
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - uploads:/app/uploads
volumes:
  mysql_data:
  uploads:
