name: Verify application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: sinnar_test
          MYSQL_USER: sinnar_test
          MYSQL_PASSWORD: ci-only-app-password
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify static site
        run: python scripts/check_frontend.py
      - name: Test H2 and package Java 21 application
        working-directory: backend
        run: sh mvnw -B -ntp verify
      - name: Test actual MySQL 8
        working-directory: backend
        run: sh mvnw -B -ntp test
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/sinnar_test?serverTimezone=UTC
          TEST_DB_USERNAME: sinnar_test
          TEST_DB_PASSWORD: ci-only-app-password
          TEST_DB_DRIVER: com.mysql.cj.jdbc.Driver
