name: Deploy frontend to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production API origin
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          url = os.environ['API_BASE_URL'].rstrip('/')
          if not re.fullmatch(r'https://[a-zA-Z0-9.-]+(?::[0-9]+)?', url):
              raise SystemExit('Set repository variable API_BASE_URL to the backend HTTPS origin.')
          config_path = Path('frontend/assets/js/config.js')
          config = config_path.read_text()
          config, count = re.subn(r"const productionOrigin = '[^']*';", 'const productionOrigin = '+repr(url)+';', config, count=1)
          if count != 1:
              raise SystemExit('Could not locate productionOrigin in the public configuration.')
          config_path.write_text(config)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
